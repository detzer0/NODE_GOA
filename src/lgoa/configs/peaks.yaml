# Peaks -- Section 8.2 of the paper.
#
# Five classes obtained by thresholding the Peaks function on a 256 x 256 grid
# over [-3, 3]^2, hidden dimension 5, terminal time T = 5, refined from K = 2 to
# K_max = 15.  Algorithm 1 uses eps_stat = 5e-3 and kappa_s = 1.5.
#
# The published ablation averages ten model seeds; this preset runs the single
# seed given by initialization.model_seed, which is what the notebook needs.

use_x64: true
verbose: false

problem:
  name: peaks
  num_classes: 5
  hidden_dim: 5
  final_time: 5.0
  samples_per_class: 1500
  train_fraction: 0.60
  grid_size: 256
  peaks_thresholds: [-2.2, 0.55, 1.75, 3.2]
  seed: 0

initialization:
  # One calibration per model seed, as in the published ablation.  Change
  # model_seed to move to another of the ten seeds.
  n_candidates: 1
  model_seed: 0
  seed_stride: 5
  search_max_epochs: 1000
  search_min_epochs: 150
  check_every: 25
  validation_patience: 8
  validation_min_delta: 1.0e-4
  learning_rate: 2.0e-3
  reg_lambda: null            # null reuses solver.reg_lambda
  control_init_noise: 0.0

solver:
  reg_lambda: 1.0e-3          # the paper reports lambda in {1e-2, 1e-3}
  stationarity_tolerance: 5.0e-3

  adam_learning_rate: 5.0e-4
  adam_min_learning_rate: 1.0e-4
  adam_lr_decay: 0.75
  adam_plateau_patience: 4
  adam_convergence_patience: 2
  adam_relative_improvement: 5.0e-3
  adam_check_every: 100
  adam_min_steps: 500
  adam_max_steps: 20000
  adam_reset_moments_on_lr_decay: true
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  grad_clip: 50.0

  use_bfgs_polish: true
  bfgs_method: L-BFGS-B
  bfgs_switch_ratio: 1.5      # kappa_s
  bfgs_max_iterations: 5000
  bfgs_ftol: 1.0e-13
  bfgs_internal_gtol: 1.0e-12
  bfgs_max_line_search_steps: 40
  bfgs_memory: 20

adaptive:
  initial_depth: 2
  max_depth: 15
  marking: conservative       # conservative | dorfler
  dorfler_fraction: 0.5
  transfer_adam_state: true
  allow_nonstationary_refinement: true
  near_stationary_ratio: 1.5
  indicator_tolerance: null
  indicator_sup_samples: 50
